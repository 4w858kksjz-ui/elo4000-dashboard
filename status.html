<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PROJECT ELO 4000 - Status</title>
<style>:root{--bg:#fff;--fg:#1c1e21;--mut:#5f6368;--line:#d9dce1;--card:#f5f6f8;--ok:#1b7f3b;--warn:#a05a00;--bad:#b3261e;--bar:#2563eb}@media(prefers-color-scheme:dark){:root{--bg:#15171a;--fg:#e8eaed;--mut:#9aa0a6;--line:#33373d;--card:#1f2226;--ok:#5bd17f;--warn:#f0b050;--bad:#ff8a80;--bar:#6ea8ff}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 system-ui,sans-serif}header{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 14px;z-index:2}
main{padding:8px 14px 40px;max-width:760px;margin:0 auto}.card{background:var(--card);border-radius:10px;padding:10px 12px;margin:10px 0}.mut{color:var(--mut);font-size:13px}h2{font-size:15px;margin:0 0 6px}
.row{display:flex;justify-content:space-between;gap:10px;padding:2px 0;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:0}.row b{font-weight:600;text-align:right;word-break:break-word}
.bar{height:12px;border-radius:6px;background:var(--line);overflow:hidden;margin:6px 0}.bar>i{display:block;height:100%;background:var(--bar)}.pill{display:inline-block;border-radius:10px;padding:1px 8px;font-size:12px;border:1px solid var(--line)}
.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}#stale{display:none;background:var(--warn);color:#000;padding:6px 14px;font-weight:600}a{color:var(--bar)}
@media(min-width:760px){.grid{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}}</style></head><body>
<div id="stale"></div><header><b>PROJECT ELO 4000 &ndash; Status</b> <span class="mut">gehostete Kopie, nur lesend</span><div id="modebar" class="mut"></div><div class="mut" id="upd">lade&hellip;</div></header><main id="main"></main>
<script>
const INTERVAL=10000;const STALE_S=900;let S=null,lastOk=null,failSince=null,timer=null;
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!==undefined)e.textContent=x;return e};
const nv=v=>v===null||v===undefined||v===''?'nicht verfuegbar':String(v);
function spark(a){const W=300,H=40,ys=a.map(p=>p[1]),mx=Math.max(...ys),mn=Math.min(...ys),x0=a[0][0],x1=a[a.length-1][0];const s=document.createElementNS('http://www.w3.org/2000/svg','svg');s.setAttribute('viewBox','0 0 '+W+' '+H);s.setAttribute('width','100%');s.setAttribute('height',H);const pl=document.createElementNS('http://www.w3.org/2000/svg','polyline');pl.setAttribute('fill','none');pl.setAttribute('stroke','currentColor');pl.setAttribute('stroke-width','1.5');pl.setAttribute('points',a.map(p=>((p[0]-x0)/Math.max(1,x1-x0)*W).toFixed(1)+','+(H-2-(p[1]-mn)/Math.max(1e-12,mx-mn)*(H-4)).toFixed(1)).join(' '));s.append(pl);return s}
function row(k,v,cls){const r=el('div','row');r.append(el('span','mut',k));r.append(el('b',cls||'',nv(v)));return r}
function card(title){const c=el('div','card');c.append(el('h2','',title));return c}
function bar(p){const b=el('div','bar');const i=el('i');i.style.width=Math.max(0,Math.min(100,p||0))+'%';b.append(i);return b}
function dur(s){if(s===null||s===undefined)return null;s=Math.round(s);const h=Math.floor(s/3600),m=Math.floor(s%3600/60);return (h?h+' h ':'')+m+' min '+(s%60)+' s'}
function sys(c){const y=S.system||{};c.append(row('Job',({job_running:'laeuft: '+((S.job||{}).kind||'?'),waiting_for_release:'wartet auf Freigabe',idle:'kein Job',no_public_job:'kein freigegebener Live-Job (ARENA_OFFLINE)'})[y.state]||y.state,y.state==='job_running'?'ok':''));
if(S.job&&S.job.process_found===false)c.append(row('Prozess','nicht gefunden - der Lauf wurde evtl. abgebrochen, Stand der Dateien siehe unten','bad'));
if(y.public_open!==undefined)c.append(row('oeffentlicher Zugang',y.public_open?'offen bis '+String(y.public_until).replace('T',' '):'geschlossen (nur lokal)',y.public_open?'warn':''));
c.append(row('Host',y.host_state?y.host_state+(y.host_problem?' - '+y.host_problem:''):null,y.host_state?(y.host_problem?'bad':'ok'):''));c.append(row('freier RAM',y.free_ram_mb===null||y.free_ram_mb===undefined?null:y.free_ram_mb+' MB'));
c.append(row('Job-RAM (gemessen)',y.job_rss_mb===null||y.job_rss_mb===undefined?null:y.job_rss_mb+' MB'));c.append(row('Job-CPU-Zeit',y.job_cpu_s===null||y.job_cpu_s===undefined?null:y.job_cpu_s+' s'));
c.append(row('freie Platte',y.free_disk_gb===null||y.free_disk_gb===undefined?null:y.free_disk_gb+' GB'));c.append(row('Leerlauf (Windows)',y.idle_s===null||y.idle_s===undefined?null:y.idle_s+' s'));
const b=y.budget;c.append(row('Budget 24 h',b?b.used_24h_h+' / '+b.cap_24h_h+' h (frei '+(b.cap_24h_h-b.used_24h_h).toFixed(2)+' h)':null));c.append(row('Budget 7 d',b?b.used_7d_h+' / '+b.cap_7d_h+' h (frei '+(b.cap_7d_h-b.used_7d_h).toFixed(2)+' h)':null));
if(y.last_stop)c.append(row('letzter Stopp ('+y.last_stop.where+')',y.last_stop.reason,'bad'))}
function render(){const m=document.getElementById('main');m.replaceChildren();const L=S.lineage||{items:[]};
const mb=document.getElementById('modebar');mb.textContent=S.arena_mode==='ARENA_LIVE'?'ARENA_LIVE - freigegebene Live-Sitzung bis '+String((S.arena_session||{}).until||'?').replace('T',' '):'ARENA_OFFLINE - keine freigegebene Live-Arena; unten stehen nur historische Ergebnisse';mb.className=S.arena_mode==='ARENA_LIVE'?'warn':'mut';
const P=S.project||{};let c=card('Projektstand');c.append(row('Champion (Referenz)',P.champion,'ok'));c.append(row('beste akzeptierte Netzgeneration',L.best_accepted));c.append(row('Netzgenerationen registriert',(L.items||[]).length));c.append(row('Arena-Modus',S.arena_mode,S.arena_mode==='ARENA_LIVE'?'warn':''));c.append(row('Stand der Daten',S.time.replace('T',' ')));
if(S.arena_hidden_local_note)c.append(row('Hinweis (nur lokal)',S.arena_hidden_local_note,'warn'));if(P.policy)c.append(row('Policy v'+P.policy.policy_version,'RAM >= '+P.policy.ram_start_min_mb+' MB, Leerlauf >= '+P.policy.user_idle_min_s+' s, Platte >= '+P.policy.disk_min_gb+' GB'));
c.append(el('div','mut','HISTORISCH = abgeschlossen oder gespeichert, AKTUELL = laeuft jetzt, GEPLANT = registriert aber nicht gestartet, nicht verfuegbar = unbekannt.'));m.append(c);
c=card('Systemstatus');sys(c);m.append(c);
(S.lineage_arena||[]).forEach(x=>{c=card('Arena '+x.candidate+' gegen '+x.reference+' · '+x.status+(x.preliminary?' · VORLAEUFIG':''));c.append(row('Match / Look / Versuch',x.match_id+' / '+x.look+' / '+nv(x.attempt_no)));c.append(row('Plan-Hash',String(x.plan_sha256).slice(0,16)+'...'));
c.append(bar(x.pairs_planned?Math.round(100*x.pairs_complete/x.pairs_planned):0));c.append(row('vollstaendige Paare',x.pairs_complete+' / '+x.pairs_planned+' ('+x.games_booked+' von '+x.games_planned+' Partien, '+x.games_missing+' fehlen)'));
c.append(row(x.candidate+' Siege / Remis / '+x.reference+' Siege',x.candidate_wins+' / '+x.draws+' / '+x.reference_wins));c.append(row('Punkte von '+x.candidate,x.candidate_score_pct===null||x.candidate_score_pct===undefined?null:x.candidate_score_pct+' %'));
c.append(row('vorlaeufige relative Elo',x.elo_preliminary===null||x.elo_preliminary===undefined?'zu wenige vollstaendige Paare':x.elo_preliminary.toFixed(1)+' ['+nv(x.ci95_preliminary&&x.ci95_preliminary[0])+'; '+nv(x.ci95_preliminary&&x.ci95_preliminary[1])+'] (95 %)'));
if(x.adjusted_preview&&x.preliminary)c.append(row('Vorschau angepasstes Intervall',x.adjusted_preview.lo.toFixed(1)+' bis '+x.adjusted_preview.hi.toFixed(1)+' (zaehlt erst am Auswertungspunkt)'));
if(x.decision)c.append(row('offizielle Entscheidung',x.decision.outcome+(x.decision.final?'':' (vorlaeufig, Erweiterung moeglich)')+': '+nv(x.decision.lo)+' bis '+nv(x.decision.hi)+' Elo gegen '+x.reference,x.decision.outcome==='ACCEPTED'?'ok':x.decision.outcome==='REJECTED'?'bad':'warn'));
c.append(el('div','mut',x.evaluation_point));c.append(el('div','mut',x.note));m.append(c)});
const CH=S.chain;if(CH&&CH.nodes){c=card('Generationskette');c.append(row('Referenz (beste akzeptierte Generation)',CH.reference,'ok'));c.append(row('aktuelle Generation',CH.current));c.append(row('Stand',String(CH.time).replace('T',' ')));
const SL={done:'fertig',release:'wartet auf Freigabe',registration:'Plan fehlt (leicht)',pending:'offen',failed:'nicht bestanden',blocked:'gesperrt'};
CH.nodes.forEach(n=>{const d=el('div','');d.style.cssText='border-top:1px solid var(--line);margin-top:8px;padding-top:6px';const h=el('div','');h.append(el('b','',n.generation_id+' '));h.append(el('span','pill '+(n.status==='ACCEPTED'?'ok':n.status==='REJECTED'||n.status==='GATE_FAILED'||n.status==='FAILED'?'bad':n.status==='INCONCLUSIVE'||n.status==='INTERRUPTED'||n.status==='AWAITING_RELEASE'?'warn':''),n.label));if(n.is_reference)h.append(el('span','pill ok','Referenz'));d.append(h);
if(n.claim)d.append(row(n.claim.code==='proven_stronger'?'Nachweislich staerker':n.claim.code==='baseline'?'Einordnung':'Kein Staerkenachweis',n.claim.text,n.claim.code==='proven_stronger'?'ok':''));d.append(row('Stufen',n.stages.map(s=>s.name+': '+(SL[s.state]||s.state)).join(' | ')));if(n.result){d.append(row('Ergebnis',n.result.outcome+(n.result.lo!==null&&n.result.lo!==undefined?' ('+n.result.lo+' bis '+n.result.hi+' Elo gegen '+n.result.reference+')':'')));if(n.result.reason)d.append(el('div','mut',n.result.reason))}
(n.history_results||[]).forEach(r=>d.append(row('frueher gemessen',r.vs+': '+r.elo+' Elo ('+r.games+' Partien)')));if(n.gate){const q=n.gate;q.attempts.forEach(a=>d.append(row('Gate-Versuch '+a.attempt_no,a.outcome+(a.cpu_s!=null?' ('+a.cpu_s+' s CPU, '+a.wall_s+' s)':''),a.result_attempt?(q.limits_ok?'ok':'bad'):'warn')));if(q.other_checks_passed)d.append(row('technische Pruefungen',(q.checks-1)+' von '+(q.checks-1)+' bestanden (ohne Ressourcenpruefung)','ok'));if(q.original)d.append(row('urspruengliche Gate-Entscheidung','nicht bestanden: '+(q.original.failed||[]).join(', ')+(q.evaluation_error?' (Bewertungsfehler der alten Regel, durch den ergebnisliefernden Versuch widerlegt)':''),'warn'));if(q.corrected)d.append(row('korrigierte Entscheidung','Gate bestanden (neu bewertet aus den vorhandenen Nachweisen)','ok'));else if(q.pending_correction)d.append(row('Korrektur','belegt, noch nicht ausgefuehrt','warn'));d.append(el('div','mut',q.strength_note))}d.append(row('naechster Schritt',n.next.text));c.append(d)});
(CH.development||[]).forEach(x=>c.append(row('Entwicklung '+x.generation_id+' gegen '+x.reference,x.outcome+(x.final?'':' (vorlaeufig)')+': '+(x.elo_gain==null?'-':x.elo_gain.toFixed(1))+' Elo relativ, angepasstes Intervall '+(x.adjusted_lo==null?'-':x.adjusted_lo.toFixed(1))+' bis '+(x.adjusted_hi==null?'-':x.adjusted_hi.toFixed(1))+', '+x.n_pairs+' Paare')));c.append(el('div','mut',CH.absolute_note||''));
if((CH.placeholders||[]).length)c.append(el('div','mut','Danach: '+CH.placeholders.join(', ')+' (noch nicht vorbereitet)'));
(CH.pending_releases||[]).forEach(q=>c.append(row('ausstehende Freigabe',q.generation+': '+q.stage+(q.attempt_no?' (Versuch '+q.attempt_no+')':''),'warn')));if((CH.problems||[]).length)CH.problems.forEach(p=>c.append(row('Hinweis',p,'bad')));
if(CH.budget)c.append(row('Rechenbudget',CH.budget.used_24h_h+' / '+CH.budget.limit_24h_h+' h (24 h), '+CH.budget.used_7d_h+' / '+CH.budget.limit_7d_h+' h (7 d)'));m.append(c)}
c=card('Generationen');c.append(row('beste akzeptierte Generation',L.best_accepted,'ok'));(L.items||[]).forEach(g=>{const d=el('div','');d.style.cssText='border-top:1px solid var(--line);margin-top:8px;padding-top:6px';
const h=el('div','');h.append(el('b','',g.generation_id+' '));h.append(el('span','pill '+(g.status==='ACCEPTED'?'ok':g.status==='REJECTED'||g.status==='FAILED'||g.status==='GATE_FAILED'?'bad':g.status==='INCONCLUSIVE'||g.status==='AWAITING_RELEASE'||g.status==='INTERRUPTED'?'warn':''),g.status));d.append(h);
d.append(row('Eltern',g.parent));d.append(row('Netz (SHA-256)',g.net_sha256?g.net_sha256.slice(0,16)+'...':null));if(g.seed!==null&&g.seed!==undefined)d.append(row('Seed',g.seed));
d.append(row('naechster Schritt',g.next&&g.next.step?g.next.step+(g.next.heavy?(g.next.grant_ok?' (Grant vorhanden)':' - wartet auf Freigabe'):' (leicht)'):(g.status==='BASELINE'?'-':'kein weiterer Schritt')));
if(g.reason)d.append(row('Begruendung',g.reason));if(g.hypothesis)d.append(el('div','mut','Hypothese: '+g.hypothesis));c.append(d)});m.append(c);
if((P.training_history||[]).length){c=card('Trainingsverlauf');P.training_history.forEach(t=>{const d=el('div','');d.style.cssText='border-top:1px solid var(--line);margin-top:6px;padding-top:4px';d.append(el('b','',nv(t.candidate_id)+' ['+t.data_class+']'));d.append(row('Lauf / Seed',nv(t.run_id)+' / '+nv(t.seed)));d.append(row('Status',t.status));d.append(row('Schritte',t.steps));d.append(row('Trainingsverlust (zuletzt)',t.final_train_loss));d.append(row('Validierungsverlust',t.val_loss));d.append(row('gebuchte Rechenzeit',t.booked_s===null||t.booked_s===undefined?null:Math.round(t.booked_s)+' s'));if((t.loss_series||[]).length>1)d.append(spark(t.loss_series));c.append(d)});m.append(c)}
const T=S.training;if(T){c=card(T.state_label||'Training');if(T.stopped_note)c.append(el('div','mut',T.stopped_note));c.append(row('Daten gespeichert am',T.last_data_time?T.last_data_time.replace('T',' '):null));c.append(row('Lauf / Kandidat',T.run_id+' / '+nv(T.candidate_id)));c.append(row('Status',T.status,T.status==='RUNNING'?'ok':T.status==='COMPLETED'?'':'warn'));
c.append(bar(T.progress_pct));c.append(row('Fortschritt',T.progress_pct+' % (Schritt '+T.step+' / '+T.total_steps+', Lauf '+T.run_index+' von '+T.runs_requested+')'));c.append(row('Epoche',T.epoch===null||T.epoch===undefined?null:T.epoch+' / '+T.epochs));
c.append(row('Trainingsverlust',T.train_loss));c.append(row('Validierungsverlust',T.val_loss));c.append(row('verstrichen',dur(T.elapsed_s)));c.append(row('Restzeit (Schaetzung)',dur(T.remaining_s_estimate)));c.append(el('div','mut',T.estimate_note));
c.append(row('Seed / Rezept',nv(T.seed)+' / '+nv(T.recipe_sha256).slice(0,12)));c.append(row('Checkpoint',T.checkpoint?(T.checkpoint.ckpt_last?'ckpt_last vorhanden':'noch keiner')+(T.checkpoint.net_last?', Netz geschrieben':''):null));
c.append(row('Netz-Hash',T.result_net_sha256?T.result_net_sha256.slice(0,16)+'...':null));if(T.stalled)c.append(row('Warnung','keine Fortschrittsmeldung seit '+dur(T.last_progress_age_s),'bad'));
if(T.stopped_because||T.error)c.append(row('Unterbrechung / Fehler',T.stopped_because||T.error,'bad'));m.append(c)}
const A=S.match;if(A){c=card(A.state_label||'Arena');if(A.stopped_note)c.append(el('div','mut',A.stopped_note));c.append(row('Daten gespeichert am',A.last_data_time?A.last_data_time.replace('T',' '):null));c.append(row('Match',A.match_id+' ('+A.status+')'));c.append(row('Spieler',A.subject+' gegen '+A.opponent));c.append(bar(A.progress_pct));
c.append(row('Partien',A.booked+' / '+A.planned+' ('+A.progress_pct+' %), verbleibend '+A.remaining));c.append(row('Siege / Remis / Niederlagen',A.w+' / '+A.d+' / '+A.l));c.append(row('Punkte',A.score_pct===null||A.score_pct===undefined?null:A.score_pct+' %'));
c.append(row('relative Elo',A.elo===null||A.elo===undefined?'keine Zahl: zu wenig Daten':A.elo+'  ['+nv(A.ci95&&A.ci95[0])+'; '+nv(A.ci95&&A.ci95[1])+']'));c.append(el('div','mut',A.elo_note));
c.append(row('Eroeffnungspaare',A.pairs_done+' / '+A.pairs_planned+(A.inherited?' (davon '+A.inherited+' Partien uebernommen)':'')));c.append(row('Zeitueberschreitungen',A.time_forfeits));c.append(row('Abbrueche (nicht gezaehlt)',A.aborted_not_counted));
c.append(row('Restlaufzeit (Schaetzung)',dur(A.remaining_s_estimate)));if(A.stalled)c.append(row('Warnung','keine Fortschrittsmeldung seit '+dur(A.last_progress_age_s),'bad'));if(A.stopped_because)c.append(row('letzter Stopp',A.stopped_because,'bad'));m.append(c)}
if((S.matches||[]).length){c=card('Matches und historische Ergebnisse');S.matches.forEach(x=>{const d=el('div','');d.style.cssText='border-top:1px solid var(--line);margin-top:6px;padding-top:4px';d.append(el('b','',x.match_id+' ['+x.data_class+']'));d.append(row('Status',x.state_label));d.append(row('Partien',x.booked+' / '+x.planned+' ('+x.progress_pct+' %)'));d.append(row('S / R / N',x.w+' / '+x.d+' / '+x.l+(x.score_pct===null||x.score_pct===undefined?'':'  ('+x.score_pct+' %)')));d.append(row('relative Elo',x.elo===null||x.elo===undefined?'keine Zahl (zu wenig Daten)':x.elo+'  ['+nv(x.ci95&&x.ci95[0])+'; '+nv(x.ci95&&x.ci95[1])+']'));d.append(row('Daten gespeichert am',x.last_data_time?x.last_data_time.replace('T',' '):null));c.append(d)});m.append(c)}
if((P.milestones||[]).length){c=card('Letzte Aktivitaeten und Meilensteine');P.milestones.forEach(t=>c.append(row(t.time.replace('T',' ')+'  ['+t.data_class+']',t.text)));m.append(c)}
c=card('Verlauf');(L.timeline||[]).slice().reverse().slice(0,15).forEach(t=>c.append(row(t.time.replace('T',' ')+'  '+t.generation_id,t.status+' - '+t.why)));m.append(c);
document.getElementById('upd').textContent='Stand '+S.time.replace('T',' ')+' (Server)'}
function tick(){if(lastOk===null)return;const a=Math.round((Date.now()-lastOk)/1000);const u=document.getElementById('upd');if(S)u.textContent='Stand '+S.time.replace('T',' ')+' - vor '+a+' s abgefragt';
const st=document.getElementById('stale');if(failSince){st.style.display='block';st.textContent='Server nicht erreichbar seit '+new Date(failSince).toLocaleTimeString()+' - letzte bekannte Daten von '+S.time.replace('T',' ')}else if(S&&S.epoch&&(Date.now()/1000-S.epoch)>STALE_S){st.style.display='block';st.textContent='PC offline oder Daten nicht aktuell - Stand '+S.time.replace('T',' ')+' (vor '+dur(Date.now()/1000-S.epoch)+')'}else st.style.display='none'}
async function load(){try{const r=await fetch('snapshot.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);S=await r.json();lastOk=Date.now();failSince=null;render()}catch(e){if(!failSince)failSince=Date.now();if(!S)document.getElementById('main').textContent='Fehler: '+e.message}tick()}
function start(){load();timer=setInterval(()=>{if(!document.hidden)load()},INTERVAL);setInterval(tick,1000)}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)load()});start();
</script></body></html>
